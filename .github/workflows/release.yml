name: Release images

on:
  push:
    tags: ["v*.*.*"]

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/core
          push: true
          tags: ghcr.io/${{ github.repository }}/core:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: services/ingest
          push: true
          tags: ghcr.io/${{ github.repository }}/ingest:${{ github.ref_name }}
