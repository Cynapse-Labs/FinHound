name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core dependencies
        run: python -m pip install -r services/core/requirements.txt
      - name: Install ingest dependencies
        run: python -m pip install -r services/ingest/requirements.txt
      - name: Test
        run: PYTHONPATH=services/core/src:services/ingest/src pytest -q
      - name: Lint
        run: ruff check services pyproject.toml && ruff format --check services pyproject.toml
