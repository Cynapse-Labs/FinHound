version: 2
updates:
  - package-ecosystem: pip
    directory: /services/core
    schedule: {interval: weekly}
  - package-ecosystem: pip
    directory: /services/ingest
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /services/core
    schedule: {interval: monthly}
  - package-ecosystem: docker
    directory: /services/ingest
    schedule: {interval: monthly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
